<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>File Tree Links</title>
  <link href="./style.css" rel="stylesheet">
</head>
<body>
  <main class="container" role="main">
    <h1 class="title">📁 Project filesystem <span class="status">readonly · v1.0.0</span></h1>

    <div class="toolbar" aria-label="Actions">
      <button class="btn">Refresh</button>
      <button class="btn">Expand all</button>
      <button class="btn">Collapse all</button>
    </div>

    <ul class="tree" aria-label="File tree">
      <li>
        <div class="node">
          <span class="icon">📦</span>
          <a class="entry" href="./">
            <span>root</span>
            <span class="tag green">workspace</span>
            <span class="meta">/</span>
          </a>
        </div>
        <ul class="children">
          <li>
            <div class="node">
              <span class="icon">🗂️</span>
              <a class="entry" href="src/">
                <span>物理用ファイル</span>
                <span class="tag purple">module</span>
                <span class="meta">/src</span>
              </a>
            </div>
            <ul class="children">
              <li>
                <div class="node">
                  <span class="icon">📄</span>
                  <a class="entry" href="soundwave/index.html">
                    <span>音声の波形を見てみよう</span>
                  </a>
                </div>
              </li>
              <li>
                <div class="node">
                  <span class="icon">📄</span>
                  <a class="entry" href="soundsource/index.html">
                    <span>特定の波形の音を出してみよう</span>
                  </a>
                </div>
              </li>
            </ul>
          </li>
          <li>
            <div class="node">
              <span class="icon">🗂️</span>
              <a class="entry" href="docs/">
                <span>その他</span>
                <span class="meta">/docs</span>
              </a>
            </div>
            <ul class="children">
              <li>
                <div class="node">
                  <span class="icon">📄</span>
                  <a class="entry" href="docs/README.md">
                    <span>README.md</span>
                    <span class="meta">MD · 4.9 KB</span>
                  </a>
                </div>
              </li>
            </ul>
          </li>

          <li>
            <div class="node">
              <span class="icon">🗂️</span>
              <a class="entry" href="assets/">
                <span>assets</span>
