<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>File Tree Links</title>
  <style>
    :root {
      --bg: #2b2b2b;
      --panel: #333842;
      --line: #454b56;
      --text: #e6e6e6;
      --muted: #9aa0a6;
      --accent: #8ab4f8;
      --hover: #1f6feb;
      --link: #c5d1ff;
      --code-green: #98c379;
      --code-purple: #c678dd;
      --code-yellow: #e5c07b;
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Courier New", monospace;
    }

    .container {
      max-width: 820px;
      margin: 48px auto;
      padding: 24px;
      background: linear-gradient(180deg, #2e3440 0%, var(--panel) 100%);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.35);
    }

    .title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 16px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .btn {
      border: 1px solid var(--line);
      background: #262a33;
      color: var(--text);
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 120ms ease, color 120ms ease, transform 80ms ease;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn:active { transform: translateY(1px); }

    /* File tree */
    .tree {
      list-style: none;
      margin: 0;
      padding: 6px 0 0 0;
      border-top: 1px dashed var(--line);
    }

    .node {
      display: grid;
      grid-template-columns: 22px 1fr;
      align-items: start;
      column-gap: 10px;
      padding: 6px 0;
    }

    .icon {
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      user-select: none;
    }

    .entry {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      text-decoration: none;
      color: var(--link);
      padding: 2px 4px;
      border-radius: 4px;
      transition: background 120ms ease, color 120ms ease;
    }
    .entry:hover {
      background: rgba(138, 180, 248, 0.08);
      color: var(--hover);
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
    }

    /* Indentation lines (programmer vibe) */
    .children {
      margin-left: 16px;
      padding-left: 12px;
      border-left: 1px dashed var(--line);
    }

    /* Code-themed tags */
    .tag {
      font-size: 12px;
      padding: 0 6px;
      border-radius: 12px;
      border: 1px solid var(--line);
      color: var(--code-yellow);
      background: #2a2f38;
    }
    .tag.green { color: var(--code-green); }
    .tag.purple { color: var(--code-purple); }

    /* Footer */
    .footer {
      margin-top: 18px;
      border-top: 1px dashed var(--line);
      padding-top: 12px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="container" role="main">
    <h1 class="title">📁 Project filesystem <span class="status">readonly · v1.0.0</span></h1>

    <div class="toolbar" aria-label="Actions">
      <button class="btn">Refresh</button>
      <button class="btn">Expand all</button>
      <button class="btn">Collapse all</button>
    </div>

    <ul class="tree" aria-label="File tree">
      <li>
        <div class="node">
          <span class="icon">📦</span>
          <a class="entry" href="./">
            <span>root</span>
            <span class="tag green">workspace</span>
            <span class="meta">/</span>
          </a>
        </div>
        <ul class="children">
          <li>
            <div class="node">
              <span class="icon">🗂️</span>
              <a class="entry" href="src/">
                <span>src</span>
                <span class="tag purple">module</span>
                <span class="meta">/src</span>
              </a>
            </div>
            <ul class="children">
              <li>
                <div class="node">
                  <span class="icon">📄</span>
                  <a class="entry" href="src/index.html">
                    <span>index.html</span>
                    <span class="meta">HTML · 2.1 KB</span>
                  </a>
                </div>
              </li>
              <li>
                <div class="node">
                  <span class="icon">📄</span>
                  <a class="entry" href="src/styles.css">
                    <span>styles.css</span>
                    <span class="meta">CSS · 1.3 KB</span>
                  </a>
                </div>
              </li>
              <li>
                <div class="node">
                  <span class="icon">📄</span>
                  <a class="entry" href="src/app.js">
                    <span>app.js</span>
                    <span class="meta">JS · 3.7 KB</span>
                  </a>
                </div>
              </li>
            </ul>
          </li>

          <li>
            <div class="node">
              <span class="icon">🗂️</span>
              <a class="entry" href="docs/">
                <span>docs</span>
                <span class="meta">/docs</span>
              </a>
            </div>
            <ul class="children">
              <li>
                <div class="node">
                  <span class="icon">📄</span>
                  <a class="entry" href="docs/README.md">
                    <span>README.md</span>
                    <span class="meta">MD · 4.9 KB</span>
                  </a>
                </div>
              </li>
              <li>
                <div class="node">
                  <span class="icon">📄</span>
                  <a class="entry" href="docs/CHANGELOG.md">
                    <span>CHANGELOG.md</span>
                    <span class="meta">MD · 1.1 KB</span>
                  </a>
                </div>
              </li>
            </ul>
          </li>

          <li>
            <div class="node">
              <span class="icon">🗂️</span>
              <a class="entry" href="assets/">
                <span>assets</span>
