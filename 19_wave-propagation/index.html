<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>波の伝わり方</title>
  <link rel="icon" type="image/svg+xml" href="../_common_/favicon.svg">
  <meta name="project:title" content="波が波源から伝わる様子を見てみよう">
  <meta name="project:category" content="物理用ファイル">
  <meta name="project:icon" content="🌊">
  <meta name="project:description" content="波源を動かし、波の速さvで伝わる波を可視化">
  <meta name="project:status" content="beta">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="../_common_/style_slide-menu.css">
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="hint">
    赤いマーカーを上下にスワイプして波源を動かしましょう（白い点は媒質の粒子）
    <span class="separator">|</span>
    <span class="icon-blue">→</span> 波は右向きに伝わります
  </div>

  <div class="info-panel">
    <div class="info-label">波の設定</div>
    <div class="control">
      <div class="control-heading">
        <label for="speedSlider">波の速さ v</label>
        <output id="speedValue">3.0</output>
      </div>
      <input type="range" id="speedSlider" min="0.5" max="8" step="0.1" value="3">
    </div>
    <div class="info-row">
      <span class="info-key">波源の変位 y:</span>
      <span class="info-value blue" id="sourceDisp">0.0</span>
    </div>
    <div class="button-row">
      <button id="playBtn">一時停止</button>
      <button id="resetBtn">リセット</button>
    </div>
    <button id="challengeBtn" class="challenge-btn">チャレンジ: OFF</button>
    <div class="stage-label" id="stageLabel" hidden></div>
  </div>

  <div class="score-card" id="scoreCard" hidden>
    <div class="info-label">採点結果</div>
    <div class="score-value"><span id="scoreValue">0</span> 点</div>
    <div class="score-comment" id="scoreComment"></div>
    <button id="nextBtn" hidden>次の波形へ</button>
    <button id="retryBtn">もう一度</button>
  </div>

  <div class="last-updated" id="lastUpdated"></div>

  <script src="js.js" charset="utf-8"></script>
  <script src="../_common_/js_common.js" charset="utf-8"></script>
  <script src="../_common_/slide-menu.js" charset="utf-8"></script>
</body>
</html>
