<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>関数の近似</title>
  <link rel="icon" type="image/svg+xml" href="../_common_/favicon.svg">
  <meta name="project:title" content="関数の近似を確かめよう">
  <meta name="project:category" content="数学用ファイル">
  <meta name="project:icon" content="📊">
  <meta name="project:description" content="様々な関数をグラフで表示して近似を確認">
  <meta name="project:status" content="ready">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="../_common_/style_slide-menu.css">
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <!-- 説明バナー -->
  <div class="instruction-banner" id="instructionBanner">
    <div class="instruction-text">
      <span>📊 マウスホイールでズーム</span>
      <span class="separator">|</span>
      <span>右下のパネルで関数を表示・非表示</span>
    </div>
  </div>
  
  <!-- 関数コントロールパネル -->
  <div class="control-panel">
    <div class="panel-title">関数の表示</div>
    
    <div class="function-item">
      <label>
        <input type="checkbox" class="function-checkbox" id="func1" checked>
        <span class="function-formula">$y = x$</span>
      </label>
      <div class="color-indicator" style="background: #ff4444;"></div>
    </div>
    
    <div class="function-item">
      <label>
        <input type="checkbox" class="function-checkbox" id="func2">
        <span class="function-formula">$y = \sin(x)$</span>
      </label>
      <div class="color-indicator" style="background: #44ff44;"></div>
    </div>
    
    <div class="function-item">
      <label>
        <input type="checkbox" class="function-checkbox" id="func3">
        <span class="function-formula">$y = \tan(x)$</span>
      </label>
      <div class="color-indicator" style="background: #4444ff;"></div>
    </div>
    
    <div class="function-item">
      <label>
        <input type="checkbox" class="function-checkbox" id="func4">
        <span class="function-formula">$y = \sqrt{1+x}$</span>
      </label>
      <div class="color-indicator" style="background: #ffaa44;"></div>
    </div>
    
    <div class="function-item">
      <label>
        <input type="checkbox" class="function-checkbox" id="func5">
        <span class="function-formula">$y = 1 + \frac{1}{2}x$</span>
      </label>
      <div class="color-indicator" style="background: #ff44ff;"></div>
    </div>
    
    <div class="zoom-info">
      <div class="info-label">ズーム</div>
      <div class="zoom-value" id="zoomValue">1.00x</div>
    </div>
    
    <div class="error-mode-section">
      <label>
        <input type="checkbox" id="errorModeCheckbox">
        <span>誤差表示モード</span>
      </label>
      <div id="errorWarning" class="error-warning" style="display: none;">⚠ 関数を2つだけ選択してください</div>
    </div>
    
    <button id="resetBtn">リセット</button>
  </div>

  <!-- 最終更新表示 -->
  <div class="last-updated" id="lastUpdated"></div>
  
  <!-- スクリーンショットボタン -->
  <button class="screenshot-btn" id="screenshotBtn" title="スクリーンショットを保存">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <circle cx="8.5" cy="8.5" r="1.5"></circle>
      <polyline points="21 15 16 10 5 21"></polyline>
    </svg>
  </button>
  
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script>
    // KaTeXで数式をレンダリング
    document.addEventListener('DOMContentLoaded', function() {
      renderMathInElement(document.body, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ]
      });
    });
  </script>
  <script src="js.js" charset="utf-8"></script>
  <script src="../_common_/js_common.js" charset="utf-8"></script>
  <script src="../_common_/slide-menu.js" charset="utf-8"></script>
</body>
</html>
