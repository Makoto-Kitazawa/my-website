<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />  <title>ドップラー効果シミュレーション（21個の円）</title>
  <link rel="icon" type="image/svg+xml" href="../_common_/favicon.svg">
  <meta name="project:title" content="ドップラー効果を視覚的に見てみよう">
  <meta name="project:category" content="物理用ファイル">
  <meta name="project:icon" content="🔊">
  <meta name="project:description" content="音源の移動による周波数変化を可視化">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="../_common_/style_slide-menu.css">
</head>
<body>
  <!-- 21個の円 -->
  <div class="dots" id="dots"></div>

  <!-- 波紋ステージ -->
  <div class="stage" id="stage">
    <div class="hint">
      ドップラー効果を確認しよう！<br/>
      画面をタップ / クリックして波紋を出してみよう
    </div>
    <div class="controls">
      <label for="speed">速さ</label>
      <input type="range" id="speed" min="10" max="1000" value="600" />
      <div class="speed-value" id="speedValue">600 px/s</div>
      <label><input type="checkbox" id="toggleDots" /> 円を非表示</label>
    </div>
  </div>

  <!-- 最終更新表示 -->
  <div class="last-updated" id="lastUpdated"></div>
  <script src="js.js" charset="utf-8"></script>
  <script src="../_common_/js_common.js" charset="utf-8"></script>
  <script src="../_common_/slide-menu.js" charset="utf-8"></script>

</body>
</html>
