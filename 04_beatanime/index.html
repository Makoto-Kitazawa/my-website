<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>Canvasでちらつきゼロの線分描画</title>
  <link rel="icon" type="image/svg+xml" href="../_common_/favicon.svg">
  <meta name="project:title" content="うなりを視覚的に見てみよう">
  <meta name="project:category" content="物理用ファイル">
  <meta name="project:icon" content="🎼">
  <meta name="project:description" content="2つの周波数が近い音波の干渉">
  <meta name="project:status" content="ready">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./../style_common.css">
  <link rel="stylesheet" href="../_common_/style_slide-menu.css">
</head>
<body>
  <h2 style="text-align:center;">Canvasでちらつきゼロの線分描画（120Hz＋表示切替）</h2>
  <canvas id="laneCanvas" width="800" height="200"></canvas>

  <div class="controls">
    <div class="panel">
      <h3>レーン1</h3>
      <div class="input-row">
        <label><input id="hz1" type="number" min="0" step="0.5" value="10" /> Hz </label>
      </div>
      <div class="btns">
        <button id="start1">Start</button>
        <button id="stop1">Stop</button>
      </div>
      <div class="input-row">
        <label><input type="checkbox" id="visible1" checked /> 表示</label>
      </div>
    </div>

    <div class="panel">
      <h3>レーン2</h3>
      <div class="input-row">
        <label><input id="hz2" type="number" min="0" step="0.5" value="10" /> Hz</label>
      </div>
      <div class="btns">
        <button id="start2">Start</button>
        <button id="stop2">Stop</button>
      </div>
      <div class="input-row">
        <label><input type="checkbox" id="visible2" checked /> 表示</label>
      </div>
    </div>
  </div>

  <!-- 最終更新表示 -->
  <div class="last-updated" id="lastUpdated"></div>

  <script src="js.js" charset="utf-8"></script>
  <script src="../_common_/js_common.js" charset="utf-8"></script>
  <script src="../_common_/slide-menu.js" charset="utf-8"></script>
</body>
</html>
