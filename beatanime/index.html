<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Canvasでちらつきゼロの線分描画</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./../style_common.css">
</head>
<body>
  <h2 style="text-align:center;">Canvasでちらつきゼロの線分描画（120Hz＋表示切替）</h2>
  <canvas id="laneCanvas" width="800" height="200"></canvas>

  <div class="controls">
    <div class="panel">
      <h3>レーン1</h3>
      <div class="input-row">
        <label><input id="hz1" type="number" min="0" step="0.5" /> Hz </label>
      </div>
      <div class="btns">
        <button id="start1">Start</button>
        <button id="stop1">Stop</button>
      </div>
      <div class="input-row">
        <label><input type="checkbox" id="visible1" checked /> 表示</label>
      </div>
    </div>

    <div class="panel">
      <h3>レーン2</h3>
      <div class="input-row">
        <label><input id="hz2" type="number" min="0" step="0.5" /> Hz</label>
      </div>
      <div class="btns">
        <button id="start2">Start</button>
        <button id="stop2">Stop</button>
      </div>
      <div class="input-row">
        <label><input type="checkbox" id="visible2" checked /> 表示</label>
      </div>
    </div>
  </div>

  <!-- 最終更新表示 -->
  <div class="last-updated" id="lastUpdated"></div>

  <script type="text/javascript" src="./js.js"></script>
  <script>
  // 最終更新日を表示
    const updated = new Date(document.lastModified);
    const yyyy = updated.getFullYear();
    const mm = String(updated.getMonth() + 1).padStart(2, '0');
    const dd = String(updated.getDate()).padStart(2, '0');
    const hh = String(updated.getHours()).padStart(2, '0');
    const min = String(updated.getMinutes()).padStart(2, '0');
    document.getElementById('lastUpdated').textContent = `最終更新：${yyyy}/${mm}/${dd} ${hh}:${min}`;
  </script>
</body>
</html>
