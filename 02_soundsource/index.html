<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>サウンドジェネレータ</title>
  <link rel="icon" type="image/svg+xml" href="../_common_/favicon.svg">
  <meta name="project:title" content="任意の波形の音波を出してみよう">
  <meta name="project:category" content="物理用ファイル">
  <meta name="project:icon" content="🎛️">
  <meta name="project:description" content="カスタム波形の音を生成">
  <meta name="project:status" content="ready">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="../_common_/style_common.css">
  <link rel="stylesheet" href="../_common_/style_slide-menu.css">
</head>
<body>
  <h1>サウンドジェネレータ v1.0</h1>

  <button id="play">▶ 再生</button>
  <button id="pause">⏸ 一時停止</button>
  <label style="margin-left: 20px;">
    トリガー: <input type="range" id="triggerSlider" min="0" max="100" value="50" style="width: 150px; vertical-align: middle;">
    <span id="triggerValue">50%</span>
  </label>

  <div id="controls"></div>
  <div id="warning">⚠ 音が鳴らない場合はマナーモードを解除してください</div>

  <canvas id="oscilloscope" width="600" height="200"></canvas>

  <!-- 最終更新表示 -->
  <div class="last-updated" id="lastUpdated"></div>
  
  <script src="js.js" charset="utf-8"></script>
  <script src="../_common_/js_common.js" charset="utf-8"></script>
  <script src="../_common_/slide-menu.js" charset="utf-8"></script>
</body>
</html>
