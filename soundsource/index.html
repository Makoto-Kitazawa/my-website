<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>サウンドジェネレータ</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: 'Orbitron', sans-serif;
      text-align: center;
    }

    h1 {
      color: #0ff;
      text-shadow: 0 0 10px #0ff;
    }

    #controls {
      margin-top: 20px;
    }

    label {
      display: block;
      margin: 15px;
      padding: 10px;
      background: #222;
      border-radius: 8px;
      box-shadow: 0 0 10px #333 inset;
    }

    input[type="number"], input[type="range"] {
      margin: 5px;
    }

    #play, #pause {
      font-size: 18px;
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      background: #333;
      transition: all 0.3s ease;
    }

    #play.active {
      background: #0f0;
      box-shadow: 0 0 20px #0f0;
    }

    #pause.active {
      background: #f00;
      box-shadow: 0 0 20px #f00;
    }

    span {
      margin-left: 10px;
      font-weight: bold;
      color: #0ff;
      text-shadow: 0 0 5px #0ff;
    }

    .vu-meter {
      display: inline-block;
      width: 100px;
      height: 10px;
      background: #333;
      border-radius: 5px;
      overflow: hidden;
      vertical-align: middle;
      margin-left: 10px;
    }

    .vu-fill {
      height: 100%;
      background: linear-gradient(90deg, #0f0, #ff0, #f00);
      width: 0%;
      transition: width 0.2s ease;
    }

    #warning {
      margin-top: 20px;
      color: #ff0;
      font-weight: bold;
      text-shadow: 0 0 10px #f00;
      display: none;
    }

    canvas {
      margin-top: 30px;
      background: #000;
      border: 2px solid #0ff;
    }
  </style>
</head>
<body>
  <h1>サウンドジェネレータ　v0.7</h1>

  <button id="play">▶ 再生</button>
  <button id="pause">⏸ 一時停止</button>

  <div id="controls"></div>
  <div id="warning">⚠ 音が鳴らない場合はマナーモードを解除してください</div>

  <canvas id="oscilloscope" width="600" height="200"></canvas>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const oscillators = [];
  const gains = [];

  // AnalyserNodeで波形を取得
  const analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  const bufferLength = analyser.fftSize;
  const dataArray = new Uint8Array(bufferLength);

  // トリガーレベル（振幅の80%）
  const triggerLevel = 0.8;

  function dbToGain(db) {
    const maxDb = 50;
    return db / maxDb; // 0〜1に収める
  }

  // ページ読み込み時にオシレーター生成（初期は無音）
  for (let i = 0; i < 4; i++) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = 440 + i * 110;
    gain.gain.value = 0; // 初期は無音

    osc.connect(gain).connect(analyser).connect(audioCtx.destination);
    osc.start();

    oscillators.push(osc);
    gains.push(gain);

    const initDb = 30;
    const div = document.createElement("div");
    div.innerHTML = `
      <label>音${i+1}:
        <input type="checkbox" id="check${i}">
        周波数 <input type="number" id="freq${i}" value="${440 + i * 110}"> Hz
        音圧 <input type="range" id="gain${i}" min="10" max="50" step="1" value="${initDb}">
        <span id="db${i}">${initDb} dB</span>
        <div class="vu-meter"><div id="vu${i}" class="vu-fill"></div></div>
      </label>
    `;
    document.getElementById("controls").appendChild(div);

    // チェックボックス
    document.getElementById(`check${i}`).addEventListener("change", e => {
      const dbVal = parseFloat(document.getElementById(`gain${i}`).value);
      gains[i].gain.value = e.target.checked ? dbToGain(dbVal) : 0;
      document.getElementById(`db${i}`).textContent = dbVal + " dB";
      document.getElementById(`vu${i}`).style.width = e.target.checked ? ((dbVal - 10) / 40 * 100) + "%" : "0%";
    });

    // 周波数変更
    document.getElementById(`freq${i}`).addEventListener("input", e => {
      oscillators[i].frequency.value = parseFloat(e.target.value);
    });

    // 音圧変更
    document.getElementById(`gain${i}`).addEventListener("input", e => {
      const dbVal = parseFloat(e.target.value);
      if (document.getElementById(`check${i}`).checked) {
        gains[i].gain.value = dbToGain(dbVal);
      }
      document.getElementById(`db${i}`).textContent = dbVal + " dB";
      document.getElementById(`vu${i}`).style.width = document.getElementById(`check${i}`).checked ? ((dbVal - 10) / 40 * 100) + "%" : "0%";
    });
  }

  // 再生・一時停止
  document.getElementById("play").addEventListener("click", () => {
    audioCtx.resume().then(() => {
      document.getElementById("play").classList.add("active");
      document.getElementById("pause").classList.remove("active");
    }).catch(() => {
      document.getElementById("warning").style.display = "block";
    });
  });

  document.getElementById("pause").addEventListener("click", () => {
    audioCtx.suspend();
    document.getElementById("pause").classList.add("active");
    document.getElementById("play").classList.remove("active");
  });

  // 波形描画
  const canvas = document.getElementById("oscilloscope");
  const canvasCtx = canvas.getContext("2d");

  function draw() {
    requestAnimationFrame(draw);

    analyser.getByteTimeDomainData(dataArray);

    canvasCtx.fillStyle = "#000";
    canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

    canvasCtx.lineWidth = 2;
    canvasCtx.strokeStyle = "#0ff";

    canvasCtx.beginPath();

    const sliceWidth = canvas.width * 1.0 / bufferLength;
    let x = 0;

    // --- トリガー検出 ---
    let startIndex = 0;
    for (let i = 1; i < bufferLength; i++) {
      const prev = (dataArray[i - 1] - 128) / 128.0;
      const curr = (dataArray[i] - 128) / 128.0;
      if (prev < triggerLevel && curr >= triggerLevel) {
        startIndex = i;
        break;
      }
    }

    // --- 波形描画 ---
    for (let i = startIndex; i < bufferLength; i++) {
      const v = dataArray[i] / 128.0;
      const y = v * canvas.height / 2;

      if (i === startIndex) {
        canvasCtx.moveTo(x, y);
      } else {
        canvasCtx.lineTo(x, y);
      }

      x += sliceWidth;
    }

    canvasCtx.lineTo(canvas.width, canvas.height / 2);
    canvasCtx.stroke();
  }

  draw();
</script>

</body>
</html>
