<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>DJ風サウンドジェネレータ</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: 'Orbitron', sans-serif;
      text-align: center;
    }

    h1 {
      color: #0ff;
      text-shadow: 0 0 10px #0ff;
    }

    #controls {
      margin-top: 20px;
    }

    label {
      display: block;
      margin: 15px;
      padding: 10px;
      background: #222;
      border-radius: 8px;
      box-shadow: 0 0 10px #333 inset;
    }

    input[type="number"], input[type="range"] {
      margin: 5px;
    }

    #play, #pause {
      font-size: 18px;
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      background: #333;
      transition: all 0.3s ease;
    }

    #play.active {
      background: #0f0;
      box-shadow: 0 0 20px #0f0;
    }

    #pause.active {
      background: #f00;
      box-shadow: 0 0 20px #f00;
    }

    span {
      margin-left: 10px;
      font-weight: bold;
      color: #0ff;
      text-shadow: 0 0 5px #0ff;
    }

    .vu-meter {
      display: inline-block;
      width: 100px;
      height: 10px;
      background: #333;
      border-radius: 5px;
      overflow: hidden;
      vertical-align: middle;
      margin-left: 10px;
    }

    .vu-fill {
      height: 100%;
      background: linear-gradient(90deg, #0f0, #ff0, #f00);
      width: 0%;
      transition: width 0.2s ease;
    }

    #warning {
      margin-top: 20px;
      color: #ff0;
      font-weight: bold;
      text-shadow: 0 0 10px #f00;
      display: none;
    }
  </style>
</head>
<body>
  <h1>DJ風サウンドジェネレータ v0.5</h1>

  <button id="play">▶ 再生</button>
  <button id="pause">⏸ 一時停止</button>

  <div id="controls"></div>
  <div id="warning">⚠ 音が鳴らない場合はマナーモードを解除してください</div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const oscillators = [];
    const gains = [];

    function dbToGain(db) {
      const maxDb = 50;
      return db / maxDb; // 0〜1に収める
    }

    // ページ読み込み時にオシレーター生成（ただし無音）
    for (let i = 0; i < 4; i++) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 440 + i * 110;
      gain.gain.value = 0; // 初期は無音

      osc.connect(gain).connect(audioCtx.destination);
      osc.start();

      oscillators.push(osc);
      gains.push(gain);

      const initDb = 30;
      const div = document.createElement("div");
      div.innerHTML = `
        <label>音${i+1}:
          <input type="checkbox" id="check${i}">
          周波数 <input type="number" id="freq${i}" value="${440 + i * 110}"> Hz
          音圧 <input type="range" id="gain${i}" min="10" max="50" step="1" value="${initDb}">
          <span id="db${i}">${initDb} dB</span>
          <div class="vu-meter"><div id="vu${i}" class="vu-fill"></div></div>
        </label>
      `;
      document.getElementById("controls").appendChild(div);

      // チェックボックス
      document.getElementById(`check${i}`).addEventListener("change", e => {
        const dbVal = parseFloat(document.getElementById(`gain${i}`).value);
        gains[i].gain.value = e.target.checked ? dbToGain(dbVal) : 0;
        document.getElementById(`db${i}`).textContent = dbVal + " dB";
        document.getElementById(`vu${i}`).style.width = e.target.checked ? ((dbVal - 10) / 40 * 100) + "%" : "0%";
      });

      // 周波数変更
      document.getElementById(`freq${i}`).addEventListener("input", e => {
        oscillators[i].frequency.value = parseFloat(e.target.value);
      });

      // 音圧変更
      document.getElementById(`gain${i}`).addEventListener("input", e => {
        const dbVal = parseFloat(e.target.value);
        if (document.getElementById(`check${i}`).checked) {
          gains[i].gain.value = dbToGain(dbVal);
        }
        document.getElementById(`db${i}`).textContent = dbVal + " dB";
        document.getElementById(`vu${i}`).style.width = document.getElementById(`check${i}`).checked ? ((dbVal - 10) / 40 * 100) + "%" : "0%";
      });
    }

    // 再生・一時停止
    document.getElementById("play").addEventListener("click", () => {
      audioCtx.resume().then(() => {
        document.getElementById("play").classList.add("active");
        document.getElementById("pause").classList.remove("active");
      }).catch(() => {
        document.getElementById("warning").style.display = "block";
      });
    });

    document.getElementById("pause").addEventListener("click", () => {
      audioCtx.suspend();
      document.getElementById("pause").classList.add("active");
      document.getElementById("play").classList.remove("active");
    });
  </script>
</body>
</html>
