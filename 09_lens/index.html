<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レンズの屈折実験</title>
    <link rel="icon" type="image/svg+xml" href="../_common_/favicon.svg">
    <meta name="project:title" content="レンズの屈折実験">
    <meta name="project:category" content="物理用ファイル">
    <meta name="project:icon" content="🔍">
    <meta name="project:description" content="凸レンズと凹レンズの光の屈折を可視化">
    <meta name="project:status" content="ready">
    <link rel="stylesheet" href="../_common_/style_slide-menu.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <!-- 情報パネル（右側） -->
    <div class="info-panel">
        <div class="info-section">
            <div class="info-label">レンズタイプ</div>
            <div class="info-value" id="lensTypeDisplay">凸レンズ</div>
        </div>
        <div class="info-section">
            <div class="info-label">焦点距離</div>
            <div class="info-value" id="focalLengthDisplay">200 px</div>
        </div>
    </div>
    
    <!-- コントローラー（下部） -->
    <div class="controls">
        <button id="playBtn">▶ 再生</button>
        <button id="resetBtn">リセット</button>
        <div class="control-group">
            <label>
                <input type="checkbox" id="lensTypeCheckbox">
                <span>凹レンズ</span>
            </label>
        </div>
        <div class="control-group">
            <label>
                <input type="checkbox" id="showExtensionCheckbox">
                <span>虚像の延長線を表示</span>
            </label>
        </div>
        <div class="control-group">
            <label>焦点距離</label>
            <input type="range" id="focalLength" min="100" max="400" step="10" value="200">
            <span class="value-display" id="focalLengthValue">200</span>
        </div>
    </div>
    
    <!-- 最終更新表示 -->
    <div class="last-updated" id="lastUpdated"></div>
    
    <script type="text/javascript" src="../_common_/js_common.js" charset="utf-8"></script>
    <script type="text/javascript" src="../_common_/slide-menu.js" charset="utf-8"></script>
    <script src="js.js"></script>
</body>
</html>
