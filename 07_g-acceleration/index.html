<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>加速度の可視化</title>
  <link rel="icon" type="image/svg+xml" href="../_common_/favicon.svg">
  <meta name="project:title" content="加速度を視覚的に見てみよう">
  <meta name="project:category" content="物理用ファイル">
  <meta name="project:icon" content="📊">
  <meta name="project:description" content="端末の加速度センサーの値を可視化">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="../_common_/style_slide-menu.css">
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <!-- 説明バナー -->
  <div class="instruction-banner" id="instructionBanner">
    <div class="instruction-text">
      端末を動かすと加速度が表示されます
      <span class="separator">|</span>
      <span class="icon-blue">→</span> 青い矢印：加速度ベクトル
    </div>
  </div>
  
  <!-- 情報表示エリア -->
  <div class="info-panel">
    <button id="resetBtn">リセット</button>
    <div class="gravity-mode">
      <label><input type="checkbox" id="removeGravity"> 重力加速度を除外</label>
    </div>
    <div class="acceleration-info">
      <div class="info-label">加速度</div>
      <div class="info-row">
        <span class="info-key">x:</span>
        <span class="info-value" id="accelX">0.0</span>
        <span class="info-unit">m/s²</span>
      </div>
      <div class="info-row">
        <span class="info-key">y:</span>
        <span class="info-value" id="accelY">0.0</span>
        <span class="info-unit">m/s²</span>
      </div>
      <div class="info-row">
        <span class="info-key">大きさ:</span>
        <span class="info-value blue" id="accelMag">0.0</span>
        <span class="info-unit">m/s²</span>
      </div>
      <div class="info-row">
        <span class="info-key">角度:</span>
        <span class="info-value blue" id="accelAngle">0.0</span>
        <span class="info-unit">°</span>
      </div>
    </div>
  </div>

  <!-- 最終更新表示 -->
  <div class="last-updated" id="lastUpdated"></div>
  
  <!-- スクリーンショットボタン -->
  <button class="screenshot-btn" id="screenshotBtn" title="スクリーンショットを保存">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <circle cx="8.5" cy="8.5" r="1.5"></circle>
      <polyline points="21 15 16 10 5 21"></polyline>
    </svg>
  </button>
  
  <script src="js.js" charset="utf-8"></script>
  <script src="../_common_/js_common.js" charset="utf-8"></script>
  <script src="../_common_/slide-menu.js" charset="utf-8"></script>
</body>
</html>
