<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ガウスの法則で電場を観察</title>
  <link rel="icon" type="image/svg+xml" href="../_common_/favicon.svg">
  <meta name="project:title" content="ガウスの法則で電場を観察しよう">
  <meta name="project:category" content="電気・磁気">
  <meta name="project:icon" content="⚙️">
  <meta name="project:description" content="3つの異なる電荷分布から発生する電気力線をガウスの法則で可視化">
  <meta name="project:status" content="beta">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="../_common_/style_slide-menu.css">
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="hint">
    スワイプ・ドラッグで視点を回転 | ホイール・ピンチでズーム
    <span class="separator">|</span>
    下のボタンから電荷物体を選んで、電気力線を表示しましょう
  </div>

  <div class="info-panel">
    <div class="info-label">ガウスの法則</div>
    
    <div class="charge-buttons">
      <button class="charge-btn" data-type="line">📏 直線電荷</button>
      <button class="charge-btn" data-type="plane">📐 平面電荷</button>
      <button class="charge-btn" data-type="sphere">⚡ 導体球</button>
    </div>

    <div class="display-toggle">
      <button id="toggleFieldLines" class="toggle-btn">電気力線を表示</button>
      <button id="toggleClosedSurface" class="toggle-btn">閉曲面を表示</button>
      <button id="toggleSurfaceOnly" class="toggle-btn">閉曲面だけ表示</button>
    </div>

    <div class="info-row">
      <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="checkbox" id="toggleArrows" style="cursor: pointer;">
        <span>矢印を表示</span>
      </label>
    </div>

    <div class="info-row">
      <span class="info-key">電荷量 Q:</span>
      <span class="info-value" id="chargeValue">+Q</span>
    </div>

    <div class="info-row">
      <span class="info-key">電気力線数:</span>
      <span class="info-value" id="fieldLineCount">0</span>
    </div>

    <div class="button-row">
      <button id="resetBtn">リセット</button>
      <button id="toggleAnimBtn">再生</button>
    </div>

    <div class="description">
      <p id="chargeDesc"></p>
    </div>
  </div>

  <div class="last-updated" id="lastUpdated"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./js.js" defer></script>
  <script src="../_common_/slide-menu.js" charset="utf-8"></script>
</body>
</html>
