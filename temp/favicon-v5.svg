<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 背景（ダークブルー） -->
  <rect width="64" height="64" fill="#1e2a3a" rx="8"/>
  
  <!-- 装飾的な波（複数レイヤー） -->
  <path d="M 0 48 Q 16 40, 32 48 T 64 48" 
        fill="#8ab4f8" opacity="0.15"/>
  <path d="M 0 54 Q 16 46, 32 54 T 64 54 L 64 64 L 0 64 Z" 
        fill="#8ab4f8" opacity="0.2"/>
  
  <!-- P文字の影 -->
  <text x="34" y="40" 
        font-family="Arial, sans-serif" 
        font-size="42" 
        font-weight="bold" 
        fill="#000000" 
        text-anchor="middle" 
        opacity="0.3">P</text>
  
  <!-- P文字（メイン） -->
  <text x="32" y="38" 
        font-family="Arial, sans-serif" 
        font-size="42" 
        font-weight="bold" 
        fill="#8ab4f8" 
        text-anchor="middle">P</text>
  
  <!-- 小さな波形アクセント（右上） -->
  <path d="M 44 16 Q 48 14, 52 16 T 60 16" 
        stroke="#e6e6e6" 
        stroke-width="2" 
        fill="none" 
        stroke-linecap="round"/>
</svg>
