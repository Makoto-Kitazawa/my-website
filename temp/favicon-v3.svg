<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 背景（グラデーション） -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e3440;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e2430;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#grad1)" rx="8"/>
  
  <!-- 円形の波（同心円） -->
  <circle cx="32" cy="32" r="20" stroke="#8ab4f8" stroke-width="2" fill="none" opacity="0.3"/>
  <circle cx="32" cy="32" r="14" stroke="#8ab4f8" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- P文字（中央） -->
  <text x="32" y="44" 
        font-family="Arial, sans-serif" 
        font-size="36" 
        font-weight="bold" 
        fill="#e6e6e6" 
        text-anchor="middle">P</text>
</svg>
