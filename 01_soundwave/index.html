
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    (function() {
      var needsBase = /github\.io$/.test(location.host) && location.pathname.indexOf('/my-website/') === 0;
      if (needsBase && !document.querySelector('base')) {
        var base = document.createElement('base');
        base.setAttribute('href', '/my-website/');
        document.head.appendChild(base);
      }
    })();
  </script>
  <title>音声波形ビューア v1.1</title>
  <link rel="icon" type="image/svg+xml" href="../_common_/favicon.svg">
  <meta name="project:title" content="音声の波形を見てみよう">
  <meta name="project:category" content="物理用ファイル">
  <meta name="project:icon" content="🎵">
  <meta name="project:description" content="マイクやファイルから音声波形を表示">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="../_common_/style_common.css">
  <link rel="stylesheet" href="../_common_/style_slide-menu.css">
</head>
<body>
  <main class="app" role="application" aria-label="音声波形ビューア v1.0">
    <h1>音声波形ビューア v1.1</h1>
    <div class="status" id="status">準備完了：iPad を含むタッチ環境で、2本指スワイプで横スクロールできます。</div>

    <section class="controls" aria-label="入力と操作">
      <div class="row">
        <button id="recordBtn" class="primary" aria-label="マイクから1秒録音">🎙️ 1秒録音して波形表示</button>
        <label class="input" for="fileInput" aria-label="音声ファイルを選択">📂 ファイルから表示</label>
        <input id="fileInput" type="file" accept="audio/*,.wav,.mp3,.ogg" />
        <button id="clearBtn" class="secondary" aria-label="キャンバスをクリア">クリア</button>
        <button id="resetViewBtn" class="secondary" aria-label="ズームをリセット">軸リセット</button>
        <button id="centerMarkersBtn" class="secondary" aria-label="マーカーを中央に移動">マーカーを中央に</button>
      </div>
      <div class="row opt">
        <label><input type="checkbox" id="normalizeChk"> 正規化（±1 にスケール）</label>
        <label><input type="checkbox" id="lockMarkersChk"> マーカー位置を固定</label>
        <span id="srInfo"></span>
        <div class="group">
          <label for="thresholdRange">検出しきい値</label>
          <input id="thresholdRange" type="range" min="0.0" max="0.2" step="0.005" value="0.0">
          <span id="thresholdVal">0.0</span>
        </div>

        <div class="group">
          <label for="prerollRange">プリロール (ms)</label>
          <input id="prerollRange" type="range" min="0" max="50" step="5" value="0">
          <span id="prerollVal">0</span>
        </div>

        <div class="group">
          <label for="zoomMode">ズーム軸</label>
          <select id="zoomMode">
            <option value="x" selected>横だけ</option>
            <option value="y">縦だけ</option>
            <option value="both">両方</option>
          </select>
        </div>
      </div>
    </section>

    <section aria-label="波形グラフ">
      <canvas id="canvas" aria-label="音圧-時間の波形（ズーム可）"></canvas>
    </section>

    <p class="note">縦軸：音圧（相対振幅, -1 ～ +1）／横軸：時間（秒）。<br>ピンチ：ズーム（縦は常に 0 中心）。<br>1本指ドラッグ：上下・左右のパン。<br><strong>2本指スワイプ：横スクロール（ズームせずに左右へ移動）。</strong><br><strong>🔵 青マーカー／🔴 赤マーカー：グラフ下のマーカーをドラッグして時間を測定。2点間の時間差がグラフ上部に表示されます。</strong><br>描画は縦軸（Y軸）より左側の領域を自動クリップします。</p>
  </main>

  <!-- 最終更新表示 -->
  <div class="last-updated" id="lastUpdated"></div>

  <script src="js.js" charset="utf-8"></script>
  <script type="text/javascript" src="../_common_/js_common.js" charset="utf-8"></script>
  <script type="text/javascript" src="../_common_/slide-menu.js" charset="utf-8"></script>
</body>
</html>
