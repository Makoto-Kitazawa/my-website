<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ヤングの実験</title>
    <link rel="icon" type="image/svg+xml" href="../_common_/favicon.svg">
    <meta name="project:title" content="ヤングの実験">
    <meta name="project:category" content="物理用ファイル">
    <meta name="project:icon" content="🌊">
    <meta name="project:description" content="光の波動性を示すヤングの二重スリット実験">
    <meta name="project:status" content="ready">
    <link rel="stylesheet" href="../_common_/style_slide-menu.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 説明バナー -->
    <div class="instruction-banner" id="instructionBanner">
        <div class="instruction-text">
            <span class="icon-light">💡</span> ヤングの実験：二重スリットを通る光の干渉パターンを観察
            <span class="separator">|</span>
            <span style="color: #e74c3c;">⬤</span> 赤丸：山
            <span class="separator">|</span>
            <span style="color: #3498db;">⬤</span> 青丸：谷
            <span class="separator">|</span>
            <span class="icon-measure">📏</span> マーカーをドラッグして球の到達点を変更できます
        </div>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <!-- コントローラー（下部） -->
    <div class="controls">
        <button id="startBtn">スタート</button>
        <button id="stopBtn">停止</button>
        <button id="resetBtn">リセット</button>
        <div class="control-group">
            <label>
                <input type="checkbox" id="diffractionMode">
                <span>超回折モード</span>
            </label>
        </div>
    </div>
    
    <script type="text/javascript" src="../_common_/js_common.js" charset="utf-8"></script>
    <script type="text/javascript" src="../_common_/slide-menu.js" charset="utf-8"></script>
    <script src="js.js"></script>
</body>
</html>
