<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>光電効果の実験</title>
  <link rel="icon" type="image/svg+xml" href="../_common_/favicon.svg">
  <meta name="project:title" content="光電効果を視覚化しよう（β）">
  <meta name="project:category" content="物理用ファイル">
  <meta name="project:icon" content="💡">
  <meta name="project:description" content="光子が光電面に当たり光電子を放出する現象を可視化">
  <meta name="project:status" content="ready">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="../_common_/style_common.css">
  <link rel="stylesheet" href="../_common_/style_slide-menu.css">
</head>
<body id="photoelectric-app">
  <main class="photoelectric-page">
    <header class="page-header">
      <p class="eyebrow">PHOTOELECTRIC EFFECT</p>
      <h1>光電効果の実験 <span>v1.0 β</span></h1>
      <p class="intro">光子が光電面に当たり光電子を放出する現象</p>
    </header>

    <section class="experiment" aria-label="光電効果のシミュレーション">
      <div class="animation-panel">
        <div class="panel-label"><span class="live-dot"></span>PHOTOELECTRIC EFFECT / 光電効果</div>
        <svg id="mainSvg" viewBox="0 0 500 350" preserveAspectRatio="xMidYMid meet" role="img" aria-label="光子が光電面に当たる">
          <defs>
            <linearGradient id="lightGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.3" />
              <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
            </linearGradient>
            <filter id="lightGlow">
              <feGaussianBlur stdDeviation="2" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
            <filter id="antennaGlow">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          
          <!-- グリッド背景 -->
          <g class="grid" opacity="0.08">
            <line x1="0" y1="175" x2="500" y2="175" stroke="#FFF" stroke-width="1"/>
            <line x1="250" y1="0" x2="250" y2="350" stroke="#FFF" stroke-width="1"/>
          </g>
          
          <!-- 左側：光源 -->
          <g id="lightSource">
            <!-- 光源の長方形（ライト） -->
            <rect x="10" y="110" width="35" height="130" fill="#FFD700" opacity="0.4" rx="4"/>
            <rect x="10" y="110" width="35" height="130" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.8" rx="4"/>
            
            <!-- 光の帯 -->
            <g id="lightBeam">
              <rect id="lightBeamRect" x="50" y="100" width="180" height="150" fill="url(#lightGradient)" opacity="0.6"/>
              <line x1="50" y1="100" x2="230" y2="100" stroke="#FFD700" stroke-width="1" opacity="0.3"/>
              <line x1="50" y1="250" x2="230" y2="250" stroke="#FFD700" stroke-width="1" opacity="0.3"/>
            </g>
            
            <!-- 光子コンテナ -->
            <g id="photonContainer" filter="url(#lightGlow)">
              <!-- 光子は動的に追加される -->
            </g>
            
            <!-- ラベル -->
            <text x="5" y="320" font-size="12" fill="#91a097">光源</text>
          </g>
          
          <!-- 右側：光電面とアンテナ -->
          <g id="detector">
            <!-- 光電面：中心角120度の扇形（右向き） -->
            <g id="photosurface" class="photosurface">
              <path d="M 330 175 L 370 105.72 A 80 80 0 0 1 370 244.28 Z" fill="none" stroke="#4a7c8c" stroke-width="5" opacity="0.9"/>
              <path d="M 330 175 L 370 105.72 A 80 80 0 0 1 370 244.28 Z" fill="#4a7c8c" opacity="0.1"/>
            </g>
            
            <!-- 中心のアンテナ -->
            <g id="antenna" filter="url(#antennaGlow)">
              <!-- 赤い丸 -->
              <circle cx="330" cy="175" r="14" fill="#FF6B6B" stroke="#FFB3B3" stroke-width="2.5"/>
              
              <!-- アンテナから下への導線 -->
              <line x1="330" y1="189" x2="330" y2="330" stroke="#FF6B6B" stroke-width="3" opacity="0.8"/>
              
              <!-- 接地点 -->
              <line x1="315" y1="330" x2="345" y2="330" stroke="#FF6B6B" stroke-width="2.5"/>
              <line x1="308" y1="338" x2="352" y2="338" stroke="#FF6B6B" stroke-width="2"/>
              <line x1="301" y1="346" x2="359" y2="346" stroke="#FF6B6B" stroke-width="1.5"/>
            </g>
            
            <!-- 光電面から右への導線 -->
            <g id="wireRight" opacity="0.8">
              <line x1="330" y1="175" x2="480" y2="175" stroke="#4a7c8c" stroke-width="2.5"/>
              <text x="405" y="165" font-size="13" fill="#91a097" font-weight="bold">+</text>
            </g>
            
            <!-- 光電子コンテナ -->
            <g id="electronContainer">
              <!-- 電子は動的に追加される -->
            </g>
            
            <!-- ラベル -->
            <text x="300" y="320" font-size="12" fill="#91a097">光電面</text>
            <text x="330" y="320" font-size="12" fill="#91a097">接地</text>
          </g>
        </svg>
        <div class="readout">
          <div><output id="photonCountValue">10</output><span>photons/s</span></div>
          <div><output id="electronCountValue">0</output><span>electrons</span></div>
        </div>
      </div>
    </section>

    <section class="controls" aria-label="光の条件を調整">
      <div class="control-column buttons-column">
        <div class="action-buttons">
          <button id="playButton" type="button">▶ 開始</button>
          <button id="resetButton" type="button">↺ リセット</button>
        </div>
      </div>
      <div class="control-column">
        <div class="control intensity-control">
          <div class="control-heading">
            <span class="control-dot"></span>
            <label for="intensitySlider">光の強度 (Intensity)</label>
            <output id="intensityValueControl" for="intensitySlider">100%</output>
          </div>
          <input type="range" id="intensitySlider" min="0" max="200" step="5" value="100">
        </div>
        <div class="control work-function-control">
          <div class="control-heading">
            <span class="control-dot"></span>
            <label for="workFunctionSlider">仕事関数 W</label>
            <output id="workFunctionValue" for="workFunctionSlider">2.0 eV</output>
          </div>
          <input type="range" id="workFunctionSlider" min="1" max="5" step="0.1" value="2.0">
        </div>
      </div>
      <div class="control-column">
        <div class="control frequency-control">
          <div class="control-heading">
            <span class="control-dot"></span>
            <label for="frequencySlider">光の周波数 (Frequency)</label>
            <output id="frequencyValueControl" for="frequencySlider">赤外線 (1.24 eV)</output>
          </div>
          <input type="range" id="frequencySlider" min="0" max="10" step="1" value="0" data-frequencies="赤外線,赤,黄,緑,青,紫,紫外線,深紫外線,軟X線,X線,硬X線">
        </div>
        <div class="control voltage-control">
          <div class="control-heading">
            <span class="control-dot"></span>
            <label for="voltageSlider">極間の電圧 V</label>
            <output id="voltageValue" for="voltageSlider">0.0 V</output>
          </div>
          <input type="range" id="voltageSlider" min="-3" max="5" step="0.1" value="0">
        </div>
      </div>
    </section>

    <section class="info-panel">
      <p class="info-text">光子がエネルギー <span id="photonEnergy">1.24 eV</span> で光電面に衝突します。仕事関数 W = <span id="workFunctionDisplay">2.0</span> eV を超えたとき、光電子が放出されます。</p>
      <p class="formula">E<sub>photon</sub> = h·f （光子のエネルギー）</p>
      <p class="formula">E<sub>kinetic</sub> = h·f - W （放出電子の運動エネルギー）</p>
    </section>
  </main>

  <script src="./js.js"></script>
</body>
</html>
