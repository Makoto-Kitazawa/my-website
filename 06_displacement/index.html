<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>変位の可視化</title>
  <link rel="icon" type="image/svg+xml" href="../_common_/favicon.svg">
  <meta name="project:title" content="変位を視覚的に見てみよう">
  <meta name="project:category" content="物理用ファイル">
  <meta name="project:icon" content="📐">
  <meta name="project:description" content="物体の移動による変位を可視化">
  <meta name="project:status" content="ready">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="../_common_/style_slide-menu.css">
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <!-- 説明バナー -->
  <div class="instruction-banner" id="instructionBanner">
    <div class="instruction-text">
      <span class="icon-red">●</span> 赤い円をドラッグして動かしてみましょう
      <span class="separator">|</span>
      <span class="icon-green">- - -</span> 緑の点線：移動の軌跡
      <span class="separator">|</span>
      <span class="icon-blue">→</span> 青い矢印：変位ベクトル
    </div>
  </div>
  
  <!-- 情報表示エリア -->
  <div class="info-panel">
    <button id="resetBtn">リセット</button>
    <div class="norm-switch">
      <label><input type="radio" name="normMode" value="l2" id="normL2" checked> 標準</label>
      <label><input type="radio" name="normMode" value="l1" id="normL1"> L1ノルム</label>
      <label><input type="radio" name="normMode" value="linf" id="normLinf"> L∞ノルム</label>
    </div>
    <div class="displacement-info">
      <div class="info-label">変位</div>
      <div class="info-row">
        <span class="info-key">x:</span>
        <span class="info-value" id="dispX">0.0</span>
      </div>
      <div class="info-row">
        <span class="info-key">y:</span>
        <span class="info-value" id="dispY">0.0</span>
      </div>
      <div class="info-row">
        <span class="info-key">大きさ:</span>
        <span class="info-value blue" id="dispMag">0.0</span>
      </div>
    </div>
    <div class="displacement-info">
      <div class="info-label">移動距離</div>
      <div class="info-row">
        <span class="info-key">総距離:</span>
        <span class="info-value green" id="totalDist">0.0</span>
      </div>
    </div>
    <div class="history-section">
      <div class="info-label">履歴 <span class="history-count" id="historyCount">(0回)</span></div>
      <div class="history-list" id="historyList">
        <div class="history-empty">まだ移動していません</div>
      </div>
    </div>
  </div>

  <!-- 最終更新表示 -->
  <div class="last-updated" id="lastUpdated"></div>
  
  <!-- スクリーンショットボタン -->
  <button class="screenshot-btn" id="screenshotBtn" title="スクリーンショットを保存">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <circle cx="8.5" cy="8.5" r="1.5"></circle>
      <polyline points="21 15 16 10 5 21"></polyline>
    </svg>
  </button>
  
  <script src="js.js" charset="utf-8"></script>
  <script src="../_common_/js_common.js" charset="utf-8"></script>
  <script src="../_common_/slide-menu.js" charset="utf-8"></script>
</body>
</html>
