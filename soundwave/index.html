
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>音声波形ビューア（1秒）</title>
  <style>
    :root {
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #222;
      --accent: #1e88e5;
      --accent-2: #2e7d32;
      --border: #e5e7eb;
      --muted: #6b7280;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(180deg, #f5f9ff, var(--bg));
      color: var(--text);
      display: grid; min-height: 100vh; place-items: center;
    }
    .app {
      width: min(900px, 94vw);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,.08);
      padding: 18px 18px 24px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 10px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button, label.input {
      appearance: none;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .04s ease, box-shadow .12s ease;
    }
    button:hover, label.input:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
    button.primary { background: var(--accent); color: #fff; border-color: transparent; }
    button.secondary { background: var(--accent-2); color: #fff; border-color: transparent; }
    input[type=file] { display: none; }
    .status { color: var(--muted); font-size: .95rem; min-height: 1.2em; margin: 6px 0 12px; }
    .controls { display: grid; gap: 8px; margin-bottom: 12px; }
    .opt { display: flex; align-items: center; gap: 8px; color: var(--muted); }
    canvas { width: 100%; height: auto; border: 1px dashed var(--border); border-radius: 12px; background: #fff; }
    .note { color: var(--muted); font-size: .9rem; margin-top: 12px; }
  </style>
</head>
<body>
  <main class="app" role="application" aria-label="音声波形ビューア（1秒）">
    <h1>音声波形ビューア（1秒）</h1>
    <div class="status" id="status">準備完了：マイク録音またはファイル読み込みで 1 秒の波形を表示します</div>

    <section class="controls" aria-label="入力と操作">
      <div class="row">
        <button id="recordBtn" class="primary" aria-label="マイクから1秒録音">🎙️ 1秒録音して波形表示</button>
        <label class="input" for="fileInput" aria-label="音声ファイルを選択">📂 ファイルから表示</label>
        <input id="fileInput" type="file" accept="audio/*,.wav,.mp3,.ogg" />
        <button id="clearBtn" class="secondary" aria-label="キャンバスをクリア">クリア</button>
      </div>
      <div class="row opt">
        <label><input type="checkbox" id="normalizeChk"> 正規化（±1 にスケール）</label>
        <span id="srInfo"></span>
      </div>
    </section>

    <section aria-label="波形グラフ">
      <canvas id="canvas" width="1100" height="360" aria-label="音圧-時間の波形"></canvas>
    </section>

    <p class="note">縦軸：音圧（相対振幅, -1 ～ +1）／横軸：時間（秒）。物理的な音圧レベル（Pa, dB SPL）に換算するには校正が必要です。</p>
  </main>

  <script>
    const statusEl = document.getElementById('status');
    const recordBtn = document.getElementById('recordBtn');
    const fileInput = document.getElementById('fileInput');
    const normalizeChk = document.getElementById('normalizeChk');
    const canvas = document.getElementById('canvas');
    const clearBtn = document.getElementById('clearBtn');
    const srInfo = document.getElementById('srInfo');
    const ctx = canvas.getContext('2d');

    // -------------- 描画ユーティリティ --------------
    function drawAxes({xmin=0,xmax=1,ymin=-1,ymax=1, margin=56}={}) {
      ctx.clearRect(0,0,canvas.width, canvas.height);
      // 背景
      ctx.fillStyle = '#fff';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      const plotW = canvas.width - margin*2;
      const plotH = canvas.height - margin*2;
      const x0 = margin, y0 = margin, x1 = x0 + plotW, y1 = y0 + plotH;

      // グリッド線
      ctx.strokeStyle = '#eef2f7';
      ctx.lineWidth = 1;
      ctx.beginPath();
      // 時間 0.2s ごと
      for (let t=0; t<=xmax; t+=0.2) {
        const x = x0 + (t - xmin)/(xmax - xmin) * plotW;
        ctx.moveTo(x, y0);
        ctx.lineTo(x, y1);
      }
      // 振幅 -1..1 0.5ごと
      for (let a=ymin; a<=ymax+1e-9; a+=0.5) {
        const y = y0 + (1 - (a - ymin)/(ymax - ymin)) * plotH;
        ctx.moveTo(x0, y);
        ctx.lineTo(x1, y);
      }
      ctx.stroke();

      // 軸
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x0, y1); ctx.lineTo(x1, y1); // x軸
      ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); // y軸
      ctx.stroke();

      // ラベル
      ctx.fillStyle = '#334155';
      ctx.font = '14px system-ui';
      ctx.textAlign = 'center';
      // x 目盛
      for (let t=0; t<=xmax; t+=0.2) {
        const x = x0 + (t - xmin)/(xmax - xmin) * plotW;
        ctx.fillText(t.toFixed(1), x, y1 + 18);
      }
      // y 目盛
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      for (let a=ymin; a<=ymax+1e-9; a+=0.5) {
        const y = y0 + (1 - (a - ymin)/(ymax - ymin)) * plotH;
        ctx.fillText(a.toFixed(1), x0 - 6, y);
      }
      // 軸タイトル
      ctx.textAlign = 'center';
      ctx.save();
      ctx.fillText('時間 [s]', (x0+x1)/2, y1 + 40);
      ctx.translate(18, (y0+y1)/2);
      ctx.rotate(-Math.PI/2);
      ctx.fillText('音圧（相対振幅）', 0, 0);
      ctx.restore();

      return {x0,y0,x1,y1, plotW, plotH};
    }

    function drawWaveform(samples, sampleRate, normalize=false) {
      if (!samples || samples.length === 0) return;
      const N = Math.min(samples.length, sampleRate); // 1秒分
      let data = samples.slice(0, N);
      if (normalize) {
        let maxAbs = 1e-9;
        for (let i=0;i<data.length;i++) maxAbs = Math.max(maxAbs, Math.abs(data[i]));
        data = data.map(v => v / maxAbs);
      }
      const {x0,y0,x1,y1, plotW, plotH} = drawAxes();
      ctx.strokeStyle = '#1e88e5';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (let i=0; i<data.length; i++) {
        const t = i / sampleRate; // 秒
        const x = x0 + (t / 1.0) * plotW;
        const y = y0 + (1 - (data[i] + 1)/2) * plotH; // -1..1 → 0..1
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    function setStatus(msg) { statusEl.textContent = msg; }

    // -------------- マイク 1秒録音（AudioWorklet / フォールバック） --------------
    async function recordOneSecond() {
      setStatus('マイクにアクセスしています...');
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }, video: false });
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      srInfo.textContent = `サンプリング周波数：${audioCtx.sampleRate} Hz`;
      const source = audioCtx.createMediaStreamSource(stream);
      const samples = [];
      const targetCount = audioCtx.sampleRate; // 1秒分

      // AudioWorklet が使える場合
      if (audioCtx.audioWorklet) {
        // Worklet コードを動的追加
        const workletCode = `class PCMCollectorProcessor extends AudioWorkletProcessor {
  process(inputs) {
    const input = inputs[0];
    if (input && input.length > 0) {
      const ch = input[0];
      this.port.postMessage(ch.slice(0));
    }
    return true;
  }
}
registerProcessor('pcm-collector', PCMCollectorProcessor);`;
        const blob = new Blob([workletCode], {type: 'application/javascript'});
        const url = URL.createObjectURL(blob);
        await audioCtx.audioWorklet.addModule(url);
        URL.revokeObjectURL(url);
        const node = new AudioWorkletNode(audioCtx, 'pcm-collector');
        source.connect(node);
        // 出力はスピーカーへつながない（ハウリング防止）
        node.port.onmessage = (e) => {
          const chunk = e.data;
          samples.push(...chunk);
          if (samples.length >= targetCount) {
            cleanup();
            drawWaveform(samples, audioCtx.sampleRate, normalizeChk.checked);
            setStatus(`録音完了：${(samples.length/audioCtx.sampleRate).toFixed(2)} 秒`);
          }
        };
        const cleanup = () => {
          try { node.disconnect(); } catch {}
          try { source.disconnect(); } catch {}
          stream.getTracks().forEach(t => t.stop());
          audioCtx.close();
        };
        // タイムアウト保険（1.2秒で終了）
        setTimeout(() => {
          if (samples.length < targetCount) {
            cleanup();
            drawWaveform(samples, audioCtx.sampleRate, normalizeChk.checked);
            setStatus('タイムアウト：取得できた分で描画しました');
          }
        }, 1200);
      } else {
        // フォールバック：ScriptProcessorNode
        const proc = audioCtx.createScriptProcessor(4096, 1, 1);
        source.connect(proc);
        proc.connect(audioCtx.destination);
        proc.onaudioprocess = (ev) => {
          const ch = ev.inputBuffer.getChannelData(0);
          samples.push(...ch);
          if (samples.length >= targetCount) {
            cleanup();
            drawWaveform(samples, audioCtx.sampleRate, normalizeChk.checked);
            setStatus(`録音完了：${(samples.length/audioCtx.sampleRate).toFixed(2)} 秒`);
          }
        };
        const cleanup = () => {
          try { proc.disconnect(); } catch {}
          try { source.disconnect(); } catch {}
          stream.getTracks().forEach(t => t.stop());
          audioCtx.close();
        };
        setTimeout(() => {
          if (samples.length < targetCount) {
            cleanup();
            drawWaveform(samples, audioCtx.sampleRate, normalizeChk.checked);
            setStatus('タイムアウト：取得できた分で描画しました');
          }
        }, 1200);
      }
    }

    // -------------- ファイル読み込み（最初の1秒を描画） --------------
    async function drawFromFile(file) {
      setStatus(`ファイル読込中：${file.name}`);
      const arrayBuf = await file.arrayBuffer();
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      srInfo.textContent = `サンプリング周波数：${audioCtx.sampleRate} Hz`;
      let audioBuf;
      try {
        audioBuf = await audioCtx.decodeAudioData(arrayBuf);
      } catch (e) {
        setStatus('この形式はブラウザでデコードできませんでした');
        audioCtx.close();
        return;
      }
      const sr = audioBuf.sampleRate;
      const ch0 = audioBuf.getChannelData(0);
      const N = Math.min(ch0.length, sr); // 1秒分
      drawWaveform(ch0.slice(0, N), sr, normalizeChk.checked);
      setStatus(`描画完了：${(N/sr).toFixed(2)} 秒分を表示（sr=${sr}Hz）`);
      audioCtx.close();
    }

    // -------------- イベント --------------
    recordBtn.addEventListener('click', async () => {
      try { await recordOneSecond(); } catch (e) { setStatus('マイクにアクセスできません：許可設定をご確認ください'); }
    });
    document.querySelector('label.input').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async (e) => {
      const f = e.target.files && e.target.files[0];
      if (f) await drawFromFile(f);
    });
    clearBtn.addEventListener('click', () => { drawAxes(); setStatus('クリアしました'); });

    // 初期描画
    drawAxes();
  </script>
</body>
</html>
