<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>File Tree Links</title>
  <link href="./style.css" rel="stylesheet">
  <link href="/_common_/style_common.css" rel="stylesheet">
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-WXT1SXS7F4"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-WXT1SXS7F4');
</script>
<!-- end of Google tag -->
  
<body>
  <main class="container" role="main">
    <h1 class="title">📁 {{ROOT_LABEL}} <span class="status">readonly · {{VERSION}}</span></h1>

    <div class="toolbar" aria-label="Actions">
      <button class="btn">#物理</button>
      <button class="btn">#アニメーション</button>
      <button class="btn">#授業で使えそう</button>
    </div>

    <ul class="tree" aria-label="File tree">
{{TREE}}
    </ul>
  </main>

  <!-- 最終更新表示 -->
  <div class="last-updated" id="lastUpdated"></div>

</body>
    <script>
      // 最終更新日を表示
    const updated = new Date(document.lastModified);
    const yyyy = updated.getFullYear();
    const mm = String(updated.getMonth() + 1).padStart(2, '0');
    const dd = String(updated.getDate()).padStart(2, '0');
    const hh = String(updated.getHours()).padStart(2, '0');
    const min = String(updated.getMinutes()).padStart(2, '0');
    document.getElementById('lastUpdated').textContent = `最終更新：${yyyy}/${mm}/${dd} ${hh}:${min}`;
  </script>
</html>
